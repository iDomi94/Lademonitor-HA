begin_charging_session:
  name: Ladevorgang beginnen
  description: >-
    Beim Einstecken/Ladebeginn aufrufen - merkt SoC-Start und Lade-Art intern
    (kein input_text/input_number-Helfer mehr nötig). Startzeit wird
    automatisch auf "jetzt" gesetzt.
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      description: Externe ID des Fahrzeugs, wie in den Lademonitor-Einstellungen hinterlegt.
      required: true
      example: enyaq
      selector:
        text:
    soc_start:
      name: Akkustand bei Ladebeginn (%)
      selector:
        number:
          min: 0
          max: 100
    charging_type:
      name: Lade-Art
      description: AC oder DC (Groß-/Kleinschreibung egal). Fällt der Sensor bei Ladeende auf "unknown" zurück, ist der hier gemerkte Wert trotzdem verfügbar.
      selector:
        select:
          options:
            - "AC"
            - "DC"

end_charging_session:
  name: Ladevorgang beenden
  description: >-
    Bei Ladeende aufrufen - kombiniert die bei "Ladevorgang beginnen"
    gemerkten Werte mit den hier übergebenen Endwerten und überträgt den
    kompletten Ladevorgang an den Server. Schlägt fehl, wenn vorher kein
    begin_charging_session für dasselbe Fahrzeug aufgerufen wurde. Gibt den
    kompletten Ladevorgang (inkl. der gemerkten Startwerte) als Response
    zurück - z.B. für eine Benachrichtigung per response_variable nutzbar.
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      description: Muss zum vorherigen begin_charging_session-Aufruf passen.
      required: true
      example: enyaq
      selector:
        text:
    external_session_id:
      name: Session-ID
      description: Optional - ohne Angabe wird die gemerkte Startzeit als eindeutige ID verwendet.
      selector:
        text:
    soc_end:
      name: Akkustand bei Ladeende (%)
      selector:
        number:
          min: 0
          max: 100
    odometer_km:
      name: Kilometerstand
      selector:
        number:
          min: 0
          mode: box
    latitude:
      name: Breitengrad
      selector:
        number:
          mode: box
    longitude:
      name: Längengrad
      selector:
        number:
          mode: box
    energy_kwh:
      name: Geladene Energie (kWh)
      description: Optional - der Server schätzt sonst über SoC-Delta × Akkukapazität.
      selector:
        number:
          min: 0
          mode: box
  response:
    optional: true

push_charging_session:
  name: Ladevorgang übertragen (alle Felder in einem Call)
  description: >-
    Überträgt einen kompletten Ladevorgang in einem Aufruf (entspricht POST
    /api/sessions/auto). Für Automationen, die Ladebeginn und Ladeende als
    getrennte Ereignisse erkennen, sind begin_charging_session +
    end_charging_session einfacher, da man Start-/Endwerte nicht selbst
    zusammenführen muss - dieser Service ist gedacht für Fälle, in denen
    bereits alle Werte auf einmal vorliegen (z.B. Import aus einer anderen
    Quelle).
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      description: Externe ID des Fahrzeugs, wie in den Lademonitor-Einstellungen hinterlegt.
      required: true
      example: enyaq
      selector:
        text:
    external_session_id:
      name: Session-ID
      description: Eindeutige ID zur Duplikatserkennung (z.B. Zeitstempel des Ladebeginns).
      required: true
      example: "20260809_1432"
      selector:
        text:
    start_time:
      name: Startzeit
      description: ISO-8601-Zeitstempel des Ladebeginns.
      required: true
      example: "2026-08-09T14:05:00"
      selector:
        text:
    end_time:
      name: Endzeit
      description: ISO-8601-Zeitstempel des Ladeendes.
      selector:
        text:
    charging_type:
      name: Lade-Art
      description: AC oder DC (Groß-/Kleinschreibung egal, Server normalisiert selbst).
      selector:
        select:
          options:
            - "AC"
            - "DC"
    soc_start:
      name: Akkustand Start (%)
      selector:
        number:
          min: 0
          max: 100
    soc_end:
      name: Akkustand Ende (%)
      selector:
        number:
          min: 0
          max: 100
    odometer_km:
      name: Kilometerstand
      selector:
        number:
          min: 0
          mode: box
    latitude:
      name: Breitengrad
      selector:
        number:
          mode: box
    longitude:
      name: Längengrad
      selector:
        number:
          mode: box
    energy_kwh:
      name: Geladene Energie (kWh)
      description: Optional - der Server schätzt sonst über SoC-Delta × Akkukapazität.
      selector:
        number:
          min: 0
          mode: box
