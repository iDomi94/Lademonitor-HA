begin_charging_session:
  name: Ladevorgang beginnen
  description: >-
    Beim Einstecken/Ladebeginn aufrufen - merkt SoC-Start und Lade-Art intern
    (kein input_text/input_number-Helfer mehr nötig). Startzeit wird
    automatisch auf "jetzt" gesetzt. Ab Lademonitor-Server 0.45.0 erscheint
    der Vorgang damit sofort als "Lädt gerade" im Dashboard.
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      description: Externe ID des Fahrzeugs, wie in den Lademonitor-Einstellungen hinterlegt.
      required: true
      example: enyaq
      selector:
        text:
    soc_start:
      name: Akkustand bei Ladebeginn (%)
      selector:
        number:
          min: 0
          max: 100
    charging_type:
      name: Lade-Art
      description: AC oder DC (Groß-/Kleinschreibung egal). Fällt der Sensor bei Ladeende auf "unknown" zurück, ist der hier gemerkte Wert trotzdem verfügbar.
      selector:
        select:
          options:
            - "AC"
            - "DC"
    outside_temp_c:
      name: Außentemperatur (°C)
      description: >-
        Optional, aber die Grundlage der Auswertung "Verbrauch nach
        Temperatur". Hier gehört der Wert BEIM EINSTECKEN hin - der Verbrauch,
        den der Server diesem Ladevorgang zurechnet, stammt von der Fahrt
        davor, und die endet genau jetzt. Üblich ist der Außentemperatur-Sensor
        des Fahrzeugs; ein Wetter- oder Thermometer-Sensor tut es genauso.
      example: "{{ states('sensor.skoda_enyaq_outside_temperature') | float(default=0) }}"
      selector:
        number:
          min: -60
          max: 60
          step: 0.1
          mode: box

    energy_sensor:
      name: Energiezähler der Wallbox
      description: >-
        Optional. Der Gesamtzähler deiner Wallbox in kWh (oder Wh), also der
        Stand, der immer weiter hochzählt - kein "Energie dieser Ladung"-Sensor.
        Sein Stand wird jetzt gemerkt und beim Ladeende abgezogen. Dann schickt
        die Integration gemessene statt geschätzter kWh, und der Ladevorgang
        zählt bei Akku-Index und Ladeverlusten mit. Braucht
        Lademonitor-Server 0.31.0 oder neuer.
      example: sensor.wallbox_energy_total
      selector:
        entity:
          domain: sensor
          device_class: energy

    grid_energy_sensor:
      name: Netzbezug-Zähler des Autos
      description: >-
        Optional, für das Laden zu Hause mit PV-Anlage/Hausakku. Ein stetig
        steigender Zähler in kWh (oder Wh), der nur die Energie zählt, die das
        Auto aus dem Netz bezogen hat - z.B. ein Integral-Helfer über
        min(Ladeleistung, Netzbezug). Sein Stand wird jetzt gemerkt und beim
        Ladeende abgezogen; der Rest der Ladung gilt als Sonnen-/Akkustrom.
        Braucht Lademonitor-Server 0.41.0 oder neuer.
      example: sensor.auto_netzbezug_energie
      selector:
        entity:
          domain: sensor
          device_class: energy
    cost_sensor:
      name: Kostenzähler des Autos
      description: >-
        Optional, gehört zum Netzbezug-Zähler. Ein stetig steigender Zähler in
        Euro (nicht Cent), der die Kosten genau dieses Netzbezugs aufsummiert, bereits mit
        dem jeweils gültigen Tarif gewichtet (z.B. Integral-Helfer über
        Netzbezugsleistung des Autos × aktueller Strompreis). Die Differenz
        geht als gemessene Gesamtkosten an den Server und ersetzt dort den
        Preis des Anbieters. Braucht Lademonitor-Server 0.41.0 oder neuer.
      example: sensor.auto_netzbezug_kosten
      selector:
        entity:
          domain: sensor

update_charging_session:
  name: Ladevorgang Zwischenstand
  description: >-
    Optional, während der Ladung aufrufen (z.B. bei jeder Änderung des
    Akkustands). Meldet den aktuellen SoC an den Server, der den laufenden
    Ladevorgang damit im Dashboard und in der Ladevorgangsliste anzeigt
    ("Lädt gerade"). Die bisher geladenen kWh aus dem Wallbox-Zähler schickt
    die Integration selbst mit. Ohne vorheriges begin_charging_session
    passiert nichts. Braucht Lademonitor-Server 0.45.0 oder neuer.
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      required: true
      example: enyaq
      selector:
        text:
    soc_current:
      name: Aktueller Akkustand (%)
      selector:
        number:
          min: 0
          max: 100
    odometer_km:
      name: Kilometerstand
      selector:
        number:
          min: 0
          max: 9999999
          mode: box

end_charging_session:
  name: Ladevorgang beenden
  description: >-
    Bei Ladeende aufrufen - kombiniert die bei "Ladevorgang beginnen"
    gemerkten Werte mit den hier übergebenen Endwerten und überträgt den
    kompletten Ladevorgang an den Server. Schlägt fehl, wenn vorher kein
    begin_charging_session für dasselbe Fahrzeug aufgerufen wurde. Gibt den
    kompletten Ladevorgang (inkl. der gemerkten Startwerte) als Response
    zurück - z.B. für eine Benachrichtigung per response_variable nutzbar.
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      description: Muss zum vorherigen begin_charging_session-Aufruf passen.
      required: true
      example: enyaq
      selector:
        text:
    external_session_id:
      name: Session-ID
      description: Optional - ohne Angabe wird die gemerkte Startzeit als eindeutige ID verwendet.
      selector:
        text:
    soc_end:
      name: Akkustand bei Ladeende (%)
      selector:
        number:
          min: 0
          max: 100
    odometer_km:
      name: Kilometerstand
      selector:
        number:
          min: 0
          mode: box
    latitude:
      name: Breitengrad
      selector:
        number:
          mode: box
    longitude:
      name: Längengrad
      selector:
        number:
          mode: box
    energy_kwh:
      name: Geladene Energie (kWh)
      description: Optional - der Server schätzt sonst über SoC-Delta × Akkukapazität.
      selector:
        number:
          min: 0
          mode: box
    outside_temp_c:
      name: Außentemperatur (°C)
      description: >-
        Nur nötig, wenn beim Ladebeginn keine übergeben wurde - sonst wird der
        dort gemerkte Wert verwendet, und der ist der bessere (er stammt vom
        Ende der Fahrt, nicht von nach dem Laden).
      selector:
        number:
          min: -60
          max: 60
          step: 0.1
          mode: box
    energy_sensor:
      name: Energiezähler der Wallbox
      description: >-
        Nur nötig, wenn er nicht schon bei "Ladevorgang beginnen" übergeben
        wurde. Wird hier zusätzlich "Geladene Energie" angegeben, hat diese
        Vorrang.
      selector:
        entity:
          domain: sensor
          device_class: energy
    grid_energy_sensor:
      name: Netzbezug-Zähler des Autos
      description: >-
        Nur nötig, wenn er nicht schon bei "Ladevorgang beginnen" übergeben
        wurde. Ein Zählerreset oder ein nicht verfügbarer Sensor lässt nur
        diesen Wert weg, der Ladevorgang wird trotzdem übertragen.
      selector:
        entity:
          domain: sensor
          device_class: energy
    cost_sensor:
      name: Kostenzähler des Autos
      description: >-
        Nur nötig, wenn er nicht schon bei "Ladevorgang beginnen" übergeben
        wurde. Ein Zählerreset oder ein nicht verfügbarer Sensor lässt nur
        diesen Wert weg, der Ladevorgang wird trotzdem übertragen.
      selector:
        entity:
          domain: sensor
    grid_energy_kwh:
      name: Davon aus dem Netz (kWh)
      description: >-
        Optional - fester Wert statt Netzbezug-Zähler, hat Vorrang vor ihm.
        Braucht Lademonitor-Server 0.41.0 oder neuer.
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    price_total:
      name: Kosten gesamt (€)
      description: >-
        Optional - fester Betrag statt Kostenzähler, hat Vorrang vor ihm.
        Ersetzt im Server den Preis des Anbieters. Braucht Lademonitor-Server
        0.41.0 oder neuer.
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
  response:
    optional: true

push_charging_session:
  name: Ladevorgang übertragen (alle Felder in einem Call)
  description: >-
    Überträgt einen kompletten Ladevorgang in einem Aufruf (entspricht POST
    /api/sessions/auto). Für Automationen, die Ladebeginn und Ladeende als
    getrennte Ereignisse erkennen, sind begin_charging_session +
    end_charging_session einfacher, da man Start-/Endwerte nicht selbst
    zusammenführen muss - dieser Service ist gedacht für Fälle, in denen
    bereits alle Werte auf einmal vorliegen (z.B. Import aus einer anderen
    Quelle).
  fields:
    vehicle_external_id:
      name: Fahrzeug-ID
      description: Externe ID des Fahrzeugs, wie in den Lademonitor-Einstellungen hinterlegt.
      required: true
      example: enyaq
      selector:
        text:
    external_session_id:
      name: Session-ID
      description: Eindeutige ID zur Duplikatserkennung (z.B. Zeitstempel des Ladebeginns).
      required: true
      example: "20260809_1432"
      selector:
        text:
    start_time:
      name: Startzeit
      description: ISO-8601-Zeitstempel des Ladebeginns.
      required: true
      example: "2026-08-09T14:05:00"
      selector:
        text:
    end_time:
      name: Endzeit
      description: ISO-8601-Zeitstempel des Ladeendes.
      selector:
        text:
    charging_type:
      name: Lade-Art
      description: AC oder DC (Groß-/Kleinschreibung egal, Server normalisiert selbst).
      selector:
        select:
          options:
            - "AC"
            - "DC"
    soc_start:
      name: Akkustand Start (%)
      selector:
        number:
          min: 0
          max: 100
    soc_end:
      name: Akkustand Ende (%)
      selector:
        number:
          min: 0
          max: 100
    odometer_km:
      name: Kilometerstand
      selector:
        number:
          min: 0
          mode: box
    latitude:
      name: Breitengrad
      selector:
        number:
          mode: box
    longitude:
      name: Längengrad
      selector:
        number:
          mode: box
    energy_kwh:
      name: Geladene Energie (kWh)
      description: Optional - der Server schätzt sonst über SoC-Delta × Akkukapazität.
      selector:
        number:
          min: 0
          mode: box
    energy_meter:
      name: kWh gemessen an
      description: >-
        Optional. "charger" = an der Wallbox bzw. Ladesäule, "vehicle" = im
        Fahrzeug abgelesen. Ohne Angabe gilt die Einstellung des Anbieters im
        Lademonitor.
      selector:
        select:
          options:
            - "charger"
            - "vehicle"
    outside_temp_c:
      name: Außentemperatur (°C)
      description: >-
        Außentemperatur beim Ladebeginn, Grundlage der Auswertung "Verbrauch
        nach Temperatur" im Dashboard. Braucht Lademonitor-Server 0.23.0 oder
        neuer; ältere Server ignorieren das Feld.
      selector:
        number:
          min: -60
          max: 60
          step: 0.1
          mode: box
    grid_energy_kwh:
      name: Davon aus dem Netz (kWh)
      description: >-
        Optional, für das Laden zu Hause mit PV-Anlage/Hausakku: der Teil der
        geladenen Energie, der aus dem Netz kam (der Rest gilt als Sonnen-/
        Akkustrom). Braucht Lademonitor-Server 0.41.0 oder neuer; ältere
        Server ignorieren das Feld.
      selector:
        number:
          min: 0
          step: 0.001
          mode: box
    price_total:
      name: Kosten gesamt (€)
      description: >-
        Optional. Gemessene Gesamtkosten des Ladevorgangs, z.B. aus einem
        Kostenzähler mit dynamischem Tarif - ersetzt im Server den Preis des
        Anbieters. Braucht Lademonitor-Server 0.41.0 oder neuer; ältere Server
        ignorieren das Feld.
      selector:
        number:
          min: 0
          step: 0.01
          mode: box
